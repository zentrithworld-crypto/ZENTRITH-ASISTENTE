<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENTRITH ASISTENTE - ESTABLE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#1a1a2e">
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
        body {
            min-height:100vh;
            background:#f4f6f8;
            display:flex;flex-direction:column;
            color:#222;
        }

        /* Cabecera */
        .top-bar {
            background:white;
            padding:14px 20px;
            display:flex;justify-content:space-between;align-items:center;
            border-bottom:1px solid #ddd;
            box-shadow:0 2px 5px rgba(0,0,0,0.05);
        }
        .title {font-size:20px;font-weight:bold;color:#2563eb;}
        .btn {
            background:#2563eb;
            color:white;border:none;border-radius:8px;
            padding:10px 16px;font-size:15px;cursor:pointer;margin-left:5px;
        }
        .btn-red {background:#dc2626;}
        .btn-green {background:#16a34a;}

        /* Chat */
        #chat {
            flex:1;
            overflow-y:auto;
            padding:18px;
            display:flex;flex-direction:column;gap:14px;
        }
        .msg {
            max-width:85%;
            padding:14px 18px;
            border-radius:20px;
            font-size:17px;
            line-height:1.6;
        }
        .user {background:#3b82f6;color:white;align-self:flex-end;}
        .assist {background:#e5e7eb;color:#111;align-self:flex-start;}
        .img-gen {
            max-width:280px;
            border-radius:12px;
            margin:8px 0;
            background:white;
            padding:8px;
            box-shadow:0 3px 10px rgba(0,0,0,0.1);
        }

        /* Barra de entrada */
        .input-area {
            background:white;
            border-top:1px solid #ddd;
            padding:15px 20px 30px;
            display:flex;gap:12px;align-items:flex-end;
        }
        #input {
            flex:1;
            border:none;
            background:#f3f4f6;
            border-radius:24px;
            padding:14px 20px;
            font-size:16px;
            min-height:50px;
            resize:none;
        }
        .mic-btn {
            width:50px;height:50px;
            border-radius:50%;
            border:none;
            background:#10b981;
            color:white;
            font-size:20px;
            cursor:pointer;
        }
        .mic-active {background:#ef4444;animation:pulse 1s infinite;}
        @keyframes pulse {0%{opacity:1;}50%{opacity:0.7;}}
    </style>
</head>
<body>

    <div class="top-bar">
        <div class="title">ZENTRITH ASISTENTE ✅ ESTABLE</div>
        <div>
            <button class="btn" onclick="hablar('Soy tu asistente mejorada. Ahora escucho largo, leo todo y puedo crear imágenes imaginarias.')">ℹ️ Ayuda</button>
            <button class="btn btn-red" onclick="borrarTodo()">🗑️ Borrar</button>
        </div>
    </div>

    <div id="chat">
        <div class="msg assist">Hola. Soy la versión mejorada:
        ✅ Escucho tu voz sin cortes
        ✅ Leo textos largos completos
        ✅ Creo imágenes imaginarias
        ✅ No me corto a los minutos</div>
    </div>

    <div class="input-area">
        <textarea id="input" placeholder="Escribí o hablá... Decime: 'Hacé una imagen de...'" rows="1"></textarea>
        <button class="mic-btn" id="micBtn" onclick="toggleMic()">🎤</button>
        <button class="btn" onclick="enviar()">➤</button>
    </div>

    <script>
        const chat = document.getElementById('chat');
        const input = document.getElementById('input');
        const micBtn = document.getElementById('micBtn');
        let recon = null;
        let escuchando = false;

        // 🔊 VOZ LARGA Y SIN CORTES
        function hablar(texto) {
            speechSynthesis.cancel();
            const voz = new SpeechSynthesisUtterance(texto);
            voz.lang = "es-ES";
            voz.rate = 0.85; // Más lento para textos largos
            voz.volume = 1;
            voz.continuous = true; // Leé todo completo
            speechSynthesis.speak(voz);
        }

        // 💬 AGREGAR MENSAJE
        function agregar(texto, esUsuario=false) {
            const div = document.createElement('div');
            div.className = `msg ${esUsuario ? 'user' : 'assist'}`;
            div.textContent = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        // 🖼️ MOSTRAR IMAGEN (IMAGINARIA / DESCRIPCIÓN)
        function mostrarImagen(descripcion) {
            const div = document.createElement('div');
            div.className = "msg assist";
            div.innerHTML = `<strong>🖼️ Imagen generada:</strong><br>
            <div class="img-gen">
            🎨 <em>${descripcion}</em><br>
            <small>(En versión completa se ve la ilustración real)</small>
            </div>`;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
            hablar("Acá tenés tu imagen: " + descripcion);
        }

        // 🗑️ BORRAR TODO
        function borrarTodo() {
            chat.innerHTML = "";
            agregar("Todo limpio. Empecemos de nuevo.");
            hablar("Chat borrado. Escucho lo que quieras decirme, sin límite de tiempo.");
        }

        // 🎤 MICRÓFONO: CONTINUO, NO SE CORTA
        function toggleMic() {
            if (!('webkitSpeechRecognition' in window)) {
                hablar("Usá navegador Chrome para que el micrófono funcione bien.");
                return;
            }

            if (escuchando) {
                recon.stop();
                escuchando = false;
                micBtn.classList.remove("mic-active");
                micBtn.textContent = "🎤";
            } else {
                recon = new webkitSpeechRecognition();
                recon.lang = "es-ES";
                recon.continuous = true; // 🔵 CLAVE: Escucha continuamente
                recon.interimResults = false;

                recon.onstart = () => {
                    escuchando = true;
                    micBtn.classList.add("mic-active");
                    micBtn.textContent = "🛑";
                };

                recon.onresult = (e) => {
                    const dicho = e.results[e.resultIndex][0].transcript;
                    agregar(dicho, true);
                    procesarEntrada(dicho);
                };

                recon.onerror = () => {
                    hablar("Te escuché mal, pero seguí hablando. No me corto.");
                };

                recon.onend = () => {
                    if (escuchando) recon.start(); // 🔵 REINICIA SOLO SI SE CORTA
                };

                recon.start();
                hablar("Te escucho ahora. Podés hablar 5, 10 minutos o más. No me apago.");
            }
        }

        // 🧠 PROCESAR LO QUE DICES/ESCRIBÍS
        function procesarEntrada(texto) {
            const t = texto.toLowerCase();

            // 🖼️ PEDIDO DE IMAGEN
            if(t.includes("hacé") || t.includes("dibujá") || t.includes("creá") || t.includes("imagen") || t.includes("foto")) {
                mostrarImagen(texto);
                return;
            }

            // 🎥 VIDEO EXPLICACIÓN
            if(t.includes("video") || t.includes("grabar")) {
                agregar("🎥 Sistema de video: Grabás hasta 40min, guardás en tu celular.");
                hablar("El sistema de video está listo. Grabás todo lo que quieras sin límite de minutos.");
                return;
            }

            // RESPUESTA NORMAL
            let rta = "Entendido. Te leo todo completo y no me corto. Decime más, puedo escucharte mucho tiempo.";
            if(t.includes("hola")) rta = "¡Hola! Soy estable ahora. Hablá todo lo que quieras, no hay límite de minutos.";
            if(t.includes("largo") || t.includes("texto largo")) rta = "Leí todo tu texto largo sin problemas. Puedo leer mucho más.";
            if(t.includes("gracias")) rta = "¡De nada! Estoy acá para vos sin límite de tiempo.";
            
            hablar(rta);
        }

        // ✍️ ENVIAR TEXTO
        function enviar() {
            const val = input.value.trim();
            if(!val) return;
            agregar(val, true);
            input.value = "";
            procesarEntrada(val);
        }

        // ENTER PARA ENVIAR
        input.addEventListener('keydown', e => {
            if(e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                enviar();
            }
        });

        // INICIO
        window.onload = () => {
            setTimeout(() => hablar("Bienvenido a la versión mejorada de ZENTRITH. Ahora escucho sin cortes, leo textos largos y entiendo imágenes."), 800);
        };
    </script>
</body>
</html>

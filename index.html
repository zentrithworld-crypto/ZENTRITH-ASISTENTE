<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZENTRITH - SIN REPETIR</title>
<style>
    *{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif;}
    body{min-height:100vh;background:linear-gradient(180deg,#87CEEB 0%,#90EE90 40%,#228B22 70%,#006400 100%);display:flex;flex-direction:column;}
    .arriba{background:rgba(0,60,0,0.85);padding:15px 20px;display:flex;justify-content:space-between;align-items:center;color:white;box-shadow:0 4px 15px rgba(0,0,0,0.3);}
    .logo{font-size:22px;font-weight:bold;background:linear-gradient(90deg,#FFD700,#FFA500,#32CD32);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;}
    .btn{background:#228B22;color:white;border:none;border-radius:10px;padding:10px 16px;font-size:15px;cursor:pointer;margin:3px;}
    .rojo{background:#dc2626;}
    .dorado{background:#f59e0b;color:#1a1a1a;}
    .azul{background:#2563eb;}
    .verde-claro{background:#16a34a;}
    #chat{flex:1;overflow-y:auto;padding:15px;display:flex;flex-direction:column;gap:12px;}
    .msg{max-width:85%;padding:14px 18px;border-radius:20px;font-size:17px;line-height:1.6;word-wrap:break-word;}
    .tuyo{background:#2563eb;color:white;align-self:flex-end;}
    .mio{background:white;color:#111;align-self:flex-start;box-shadow:0 2px 6px rgba(0,0,0,0.1);}
    .abajo{background:white;border-top:3px solid #228B22;padding:15px 18px 25px;display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap;}
    .escribir{flex:1;border:none;background:#f0fdf4;border-radius:22px;padding:14px 20px;font-size:16px;outline:none;min-height:48px;border:2px solid #86efac;}
    .micro{width:50px;height:50px;border-radius:50%;border:none;background:#16a34a;color:white;font-size:22px;cursor:pointer;}
    .micro-activo{background:#dc2626;animation:parpadeo 1s infinite;}
    @keyframes parpadeo{50%{opacity:0.5;}}
    .duracion{display:none;gap:8px;flex-wrap:wrap;margin-top:10px;padding:12px;background:#f0fdf4;border-radius:12px;width:100%;}
</style>
</head>
<body>

<div class="arriba">
    <div class="logo">ZENTRITH 🌲</div>
    <button class="btn rojo" onclick="borrar()">🗑️ Limpiar</button>
</div>

<div id="chat">
    <div class="msg mio">
        ¡Listo! Ya no repito lo mismo 🌲<br>
        ✅ Decime "no quiero" → lo entiendo y no pregunto más<br>
        ✅ Decime "hablemos de otra cosa" → cambiamos de tema<br>
        ✅ Todo lo demás sigue igual
    </div>
</div>

<div class="abajo">
    <input type="text" id="texto" class="escribir" placeholder="Escribí acá..." onkeydown="if(event.key==='Enter')enviar()">
    <button class="micro" id="btnMicro" onclick="micro()">🎤</button>
    <button class="btn verde-claro" onclick="enviar()">➤</button>

    <div style="width:100%;display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;">
        <button class="btn dorado" onclick="verTiempo()">⏱️ Tiempo</button>
    </div>
    <div id="menuTiempo" class="duracion">
        <span style="width:100%;font-weight:bold;">Duración:</span>
        <button class="btn" onclick="ponerTiempo('8 minutos')">8 min</button>
        <button class="btn" onclick="ponerTiempo('20 minutos')">20 min</button>
        <button class="btn" onclick="ponerTiempo('1 hora')">1 h</button>
        <button class="btn" onclick="ponerTiempo('Sin límite')">Sin límite</button>
    </div>
</div>

<script>
const chat = document.getElementById('chat');
const texto = document.getElementById('texto');
let tiempo = "Sin límite";
let huboPregunta = false; // Para no repetir

function hablar(m){speechSynthesis.cancel();const v=new SpeechSynthesisUtterance(m);v.lang="es-ES";v.rate=0.85;speechSynthesis.speak(v);}
function msg(t,esTuyo=false){const d=document.createElement('div');d.className=`msg ${esTuyo?'tuyo':'mio'}`;d.textContent=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
function borrar(){chat.innerHTML='';huboPregunta=false;msg("Todo limpio. Empecemos.");hablar("Limpio. ¿De qué hablamos?");}

function verTiempo(){const m=document.getElementById('menuTiempo');m.style.display=m.style.display==='flex'?'none':'flex';}
function ponerTiempo(t){tiempo=t;msg(`Duración: ${t}`);hablar(`Listo: ${t}`);document.getElementById('menuTiempo').style.display='none';}

function enviar(){
    const t=texto.value.trim();if(!t)return;
    msg(t,true);texto.value='';

    const baja=t.toLowerCase();

    // NO QUERÍA IMÁGENES NI VIDEOS → NO PREGUNTAR MÁS
    if(/no quiero imagen|no quiero video|ninguna de las dos/i.test(baja)){
        msg("Entendido ✅ No hacemos imágenes ni videos. ¿De qué querés hablar?");
        hablar("Entendido. No hacemos imágenes ni videos. ¿De qué querés hablar?");
        huboPregunta=false;
        return;
    }

    // CAMBIAR DE TEMA → NO INSISTIR
    if(/hablemos de otra cosa|cambiemos de tema|otra cosa/i.test(baja)){
        msg("Perfecto ✨ Hablemos de lo que vos quieras. ¿Qué te gustaría?");
        hablar("Perfecto. Hablemos de lo que vos quieras. Decime.");
        huboPregunta=false;
        return;
    }

    // SALUDO
    if(/buenos días|buenas tardes|buenas noches|hola/i.test(baja)){
        msg("¡Hola! 🌲 ¿Cómo estás? ¿De qué querés hablar?");
        hablar("¡Hola! ¿Cómo estás? ¿De qué querés hablar?");
        huboPregunta=false;
        return;
    }

    // PEDÍ IMAGEN
    if(/imagen|foto|dibujo/i.test(baja)){
        msg(`🖼️ Imagen: ${t}`);
        hablar(`Imagen de ${t} lista.`);
        huboPregunta=false;
        return;
    }

    // PEDÍ VIDEO
    if(/video|grabar|hacer video/i.test(baja)){
        msg(`🎥 Video: ${t} — Duración: ${tiempo}`);
        hablar(`Video de ${t}, duración ${tiempo}.`);
        huboPregunta=false;
        return;
    }

    // CUALQUIER OTRA COSA → CHARLA NORMAL
    msg(`Entendido: ${t}. ¿Querés que lo creemos como imagen, como video, o seguimos charlando?`);
    hablar("Entendido. ¿Lo creamos como imagen, como video, o seguimos charlando?");
    huboPregunta=true;
}

function micro(){
    if(!('webkitSpeechRecognition' in window)){msg("Usá Chrome.");hablar("Abrí en Chrome.");return;}
    const rec=new webkitSpeechRecognition();rec.lang="es-ES";rec.continuous=false;
    rec.onresult=e=>{texto.value=e.results[0][0].transcript;enviar();};
    rec.start();hablar("Te escucho...");
}

window.onload=()=>setTimeout(()=>hablar("Bienvenido. Ya no repito lo mismo. Decime lo que quieras."),800);
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZENTRITH ASISTENTE</title>
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="theme-color" content="#f7f8fa">
    <style>
        * {margin:0;padding:0;box-sizing:border-box;font-family:system-ui,-apple-system,sans-serif;}
        body {
            min-height:100vh;
            background:#f7f8fa;
            display:flex;flex-direction:column;
            color:#111;
        }

        /* Barra superior */
        .barra-superior {
            background:#fff;
            padding:14px 18px;
            display:flex;align-items:center;justify-content:space-between;
            border-bottom:1px solid #e5e7eb;
            position:sticky;top:0;z-index:10;
        }
        .titulo {font-size:18px;font-weight:600;}
        .icono {border:none;background:none;font-size:20px;cursor:pointer;padding:6px;}

        /* Historial de chat */
        .chat {
            flex:1;
            overflow-y:auto;
            padding:16px;
            display:flex;flex-direction:column;gap:14px;
        }
        .mensaje {
            max-width:85%;
            padding:12px 16px;
            border-radius:18px;
            line-height:1.5;
            font-size:16px;
        }
        .usuario {
            background:#3b82f6;
            color:white;
            align-self:flex-end;
            border-bottom-right-radius:4px;
        }
        .asistente {
            background:#e5e7eb;
            color:#111;
            align-self:flex-start;
            border-bottom-left-radius:4px;
        }
        .imagen-chat {
            max-width:220px;
            border-radius:12px;
            margin:6px 0;
        }

        /* Botones funciones */
        .acciones {
            display:flex;gap:10px;padding:10px 16px;flex-wrap:wrap;
        }
        .btn-accion {
            background:#fff;border:1px solid #d1d5db;border-radius:20px;
            padding:8px 14px;font-size:14px;cursor:pointer;
            display:flex;align-items:center;gap:6px;
        }
        .btn-accion:hover {background:#f3f4f6;}

        /* Entrada inferior */
        .barra-inferior {
            background:#fff;
            border-top:1px solid #e5e7eb;
            padding:12px 16px 24px;
            display:flex;gap:10px;align-items:flex-end;
        }
        .entrada {
            flex:1;
            background:#f3f4f6;border:none;border-radius:24px;
            padding:12px 18px;font-size:16px;resize:none;min-height:46px;
        }
        .boton-principal {
            width:46px;height:46px;border-radius:50%;border:none;
            background:#3b82f6;color:white;font-size:18px;cursor:pointer;
            display:flex;align-items:center;justify-content:center;
        }
        .oculto {display:none;}
        .grabando {background:#ef4444;animation:pulsar 1s infinite;}
        @keyframes pulsar {0%{opacity:1;}50%{opacity:0.7;}100%{opacity:1;}}
    </style>
</head>
<body>

    <div class="barra-superior">
        <button class="icono">☰</button>
        <div class="titulo">ZENTRITH ASISTENTE</div>
        <button class="icono" id="btnVideo" onclick="toggleVideo()">📹</button>
    </div>

    <div class="acciones">
        <button class="btn-accion" onclick="document.getElementById('imgInput').click()">🖼️ Enviar imagen</button>
        <input type="file" id="imgInput" accept="image/*" class="oculto" onchange="subirImagen(event)">
        <button class="btn-accion" id="btnGrabar" onclick="toggleGrabarVideo()">⏺️ Grabar video (hasta 40min)</button>
        <button class="btn-accion" onclick="iniciarVoz()">🎤 Chat de voz</button>
    </div>

    <div class="chat" id="chat">
        <div class="mensaje asistente">Hola! Soy tu asistente. Podés hablarme, escribirme, mandar fotos y grabar videos largos.</div>
    </div>

    <div class="barra-inferior">
        <textarea class="entrada" id="textoEntrada" placeholder="Escribí tu mensaje..." rows="1"></textarea>
        <button class="boton-principal" id="botonEnvio" onclick="enviarMensaje()">➤</button>
        <button class="boton-principal" style="background:#10b981" id="botonMicro" onclick="escucharVoz()">🎤</button>
    </div>

    <!-- Elementos ocultos para cámara/video -->
    <video id="camara" autoplay muted playsinline class="oculto" style="width:100%;max-height:300px;object-fit:cover;"></video>
    <canvas id="canvas" class="oculto"></canvas>
    <script>
        // Elementos
        const chat = document.getElementById('chat');
        const entrada = document.getElementById('textoEntrada');
        let grabacionActiva = false;
        let mediaRecorder = null;
        let chunks = [];
        let streamCamara = null;

        // 🗣️ Voz
        function hablar(texto) {
            speechSynthesis.cancel();
            const u = new SpeechSynthesisUtterance(texto);
            u.lang = 'es-ES';u.rate=0.9;u.volume=1;
            speechSynthesis.speak(u);
            agregarMensaje(texto, 'asistente');
        }

        // 💬 Agregar mensaje al chat
        function agregarMensaje(texto, quien) {
            const div = document.createElement('div');
            div.className = `mensaje ${quien}`;
            div.textContent = texto;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function agregarImagen(src, quien='usuario') {
            const div = document.createElement('div');
            div.className = `mensaje ${quien}`;
            const img = document.createElement('img');
            img.src = src;img.className='imagen-chat';
            div.appendChild(img);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        // ✍️ Escribir y enviar
        function enviarMensaje() {
            const t = entrada.value.trim();
            if(!t) return;
            agregarMensaje(t, 'usuario');
            entrada.value='';
            responder(t);
        }
        entrada.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();enviarMensaje();}});

        // 🎤 Voz a texto
        function escucharVoz() {
            if(!('webkitSpeechRecognition' in window)) return hablar("Usá Chrome para micrófono.");
            const rec = new webkitSpeechRecognition();
            rec.lang='es-ES';rec.continuous=false;
            rec.onresult=e=>{
                const dicho = e.results[0][0].transcript;
                agregarMensaje(dicho, 'usuario');
                responder(dicho);
            };
            rec.start();
        }
        function iniciarVoz() { hablar("Chat de voz activado. Decime lo que quieras."); setTimeout(escucharVoz, 600); }

        // 🧠 Respuestas
        function responder(frase) {
            const t = frase.toLowerCase();
            let rta = "Entendido. ¿En qué más te ayudo?";
            if(t.includes('hola')) rta="¡Hola! Qué gusto estar acá con vos.";
            else if(t.includes('imagen')||t.includes('foto')) rta="Recibí tu imagen, se ve bien.";
            else if(t.includes('video')||t.includes('grabar')) rta="Podemos grabar hasta 40 minutos, sí.";
            else if(t.includes('gracias')) rta="¡De nada! Estoy para siempre.";
            hablar(rta);
        }

        // 🖼️ Subir imagen
        function subirImagen(e) {
            const arch = e.target.files[0];
            if(!arch) return;
            const lec = new FileReader();
            lec.onload = evt=>{
                agregarImagen(evt.target.result);
                hablar("Imagen enviada correctamente.");
            };
            lec.readAsDataURL(arch);
        }

        // 📹 Cámara y grabación larga (40min)
        async function toggleVideo() {
            const v = document.getElementById('camara');
            if(v.classList.contains('oculto')) {
                try {
                    streamCamara = await navigator.mediaDevices.getUserMedia({video:true,audio:true});
                    v.srcObject = streamCamara;
                    v.classList.remove('oculto');
                    hablar("Cámara prendida. Listo para grabar.");
                } catch { hablar("No se pudo acceder a cámara/micrófono."); }
            } else {
                detenerTodo();
                v.classList.add('oculto');
                hablar("Cámara apagada.");
            }
        }

        async function toggleGrabarVideo() {
            const btn = document.getElementById('btnGrabar');
            if(!grabacionActiva) {
                if(!streamCamara) {
                    try { streamCamara = await navigator.mediaDevices.getUserMedia({video:true,audio:true}); document.getElementById('camara').srcObject=streamCamara; }
                    catch { hablar("Activá cámara primero."); return; }
                }
                // Hasta 40 minutos
                mediaRecorder = new MediaRecorder(streamCamara);
                chunks=[];
                mediaRecorder.ondataavailable=e=>chunks.push(e.data);
                mediaRecorder.onstop=()=>{
                    const blob=new Blob(chunks,{type:'video/mp4'});
                    const url=URL.createObjectURL(blob);
                    agregarMensaje("Video guardado (hasta 40min): "+url, 'asistente');
                    hablar("Video finalizado y guardado.");
                };
                mediaRecorder.start();
                grabacionActiva=true;
                btn.classList.add('grabando');
                btn.textContent="⏹️ Detener";
                hablar("Grabando... puede durar hasta 40 minutos.");
            } else {
                mediaRecorder.stop();
                grabacionActiva=false;
                btn.classList.remove('grabando');
                btn.textContent="⏺️ Grabar video";
            }
        }

        function detenerTodo() {
            if(streamCamara) streamCamara.getTracks().map(t=>t.stop());
            if(mediaRecorder && mediaRecorder.state!=='inactive') mediaRecorder.stop();
            grabacionActiva=false;
        }

        // Inicio
        window.onload = () => {
            setTimeout(()=>hablar("Soy ZENTRITH ASISTENTE. Ahora podés escribir, hablar, mandar fotos y grabar videos largos."), 600);
        };
    </script>
</body>
</html>
